# Portal SOC de xest — configuración de PARTIDA (deliberadamente floja).
# NO tiene cabeceras de seguridad, expone la versión y admite métodos de más.
# En PPS UT5 el alumnado la sustituye por PPS/material/baseline/nginx-hardening.conf
# y demuestra la mejora con testssl.sh/lynis (auditoría antes/después).
#
# Puntos débiles sembrados a propósito (que el alumnado debe encontrar y cerrar):
#   - server_tokens on  -> filtra la versión de nginx.
#   - sin Strict-Transport-Security, sin Content-Security-Policy.
#   - sin X-Content-Type-Options, sin Referrer-Policy.
#   - método TRACE no deshabilitado.
#   - autoindex on en /static -> listado de directorios.

server {
    listen 80;
    server_name portal-soc.xest.local objetivo.xest.local;

    server_tokens on;            # DÉBIL: revela versión

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /static/ {
        autoindex on;            # DÉBIL: listado de directorios
    }

    # Sin bloque de cabeceras de seguridad: ese es el trabajo de PPS UT5.
    # Sin límite de tasa: lo añade UT5 (anti-automatización).
}
