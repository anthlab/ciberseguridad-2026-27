# Ajuste de falsos positivos del WAF del portal SOC — PPS-E9 · SOLO AFINADO.
#
# Principio del entregable: ante un falso positivo NO se apaga el WAF. Se acota
# la excepción a la regla concreta y a la ruta/parámetro concretos, y se justifica.
# Todo lo que quede fuera de esta exclusión SIGUE protegido.
#
# --- Falso positivo observado ---------------------------------------------------
# El editor de reglas del SOC (ruta /reglas/editar) envía en el campo `filtro`
# expresiones legítimas del tipo:  severity > 3 AND id = 1001
# El CRS lo marca como inyección SQL (regla 942100, libinjection) y, en modo On,
# lo bloquearía. Es tráfico legítimo de ESA ruta y ESE parámetro.
#
# --- Ajuste acotado (no desactiva el WAF) ---------------------------------------
# Quita SOLO la regla 942100, SOLO para el argumento `filtro`, SOLO en /reglas/editar.
# El SQLi sigue detectándose en cualquier otro parámetro y cualquier otra ruta.
SecRule REQUEST_URI "@beginsWith /reglas/editar" \
    "id:10001,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetById=942100;ARGS:filtro"

# --- Cómo se documenta el ajuste en el entregable -------------------------------
#   1) Captura del log de auditoría con el falso positivo (regla 942100, ARGS:filtro).
#   2) Esta exclusión, con su justificación (arriba).
#   3) Prueba de que un SQLi REAL en otro parámetro (p. ej. ?q=1' OR '1'='1) SIGUE
#      siendo bloqueado tras el ajuste: el control no se ha perdido.
#
# Alternativas más quirúrgicas si el caso lo permite (documentar cuál se elige):
#   - Subir el umbral de anomalía en vez de quitar la regla (menos agresivo).
#   - ctl:ruleRemoveById solo si la regla es inaplicable a todo el sitio (raro).
