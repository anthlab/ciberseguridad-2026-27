# Baseline de bastionado de Nginx (PPS · UT5)
#
# Configuración de referencia alineada con CCN-STIC 652 y CIS Benchmark de Nginx.
# Es material didáctico: revisar y adaptar rutas, dominios y certificados antes de
# aplicar. Validar siempre con `nginx -t` y auditar antes/después con testssl.sh.

# --- Ocultar versión y cabecera de servidor -------------------------------------
server_tokens off;

# --- Límites que mitigan abuso y automatización ---------------------------------
client_max_body_size 10m;
client_body_timeout 10s;
client_header_timeout 10s;

# Zona de limitación de tasa (rate limiting) contra fuerza bruta / registro masivo
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name portal-soc.xest.local;

    # --- TLS moderno: solo 1.2 y 1.3, suites fuertes ----------------------------
    ssl_certificate     /etc/nginx/tls/portal.crt;
    ssl_certificate_key /etc/nginx/tls/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # --- Cabeceras de seguridad -------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Métodos permitidos: bloquear TRACE y compañía --------------------------
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) {
        return 405;
    }

    # --- Aplicar la limitación de tasa ------------------------------------------
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de salud para las sondas de disponibilidad (UT8)
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080/health;
    }

    # Denegar acceso a ficheros ocultos y de control de versiones
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# --- Redirección de HTTP a HTTPS ------------------------------------------------
server {
    listen 80;
    server_name portal-soc.xest.local;
    return 301 https://$host$request_uri;
}
