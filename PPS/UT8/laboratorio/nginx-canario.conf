# Reparto de tráfico canario para el portal SOC (PPS UT8).
# 90% estable / 10% canario mediante 'weight'. Al PROMOVER se invierte el peso;
# al REVERTIR se retira 'canario' de este bloque y se recarga nginx.
#
# proxy_next_upstream hace además resiliencia real: si el canario responde 5xx,
# nginx reintenta contra el estable, de modo que el usuario no ve el error.

upstream portal {
    server estable:8080 weight=9;
    server canario:8080 weight=1 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name portal-soc.xest.local;

    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /health {
        proxy_pass http://portal;
    }
}
