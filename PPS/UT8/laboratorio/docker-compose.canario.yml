# PPS UT8 · Despliegue canario del portal SOC de xest.
# Dos versiones del MISMO servicio + un proxy de reparto por peso.
# NO exponer a Internet. Solo VLAN de aula aislada.
#
#   docker compose -f docker-compose.canario.yml up -d estable      # solo estable
#   ./deploy-canario.sh                                             # canario + sonda + reversión
#
# El canario y el proxy viven en perfiles: no arrancan por defecto, los levanta el script.
name: xest-ut8

services:
  # --- versión en producción (buena) ---
  estable:
    image: python:3.12-slim
    container_name: portal-estable
    working_dir: /app
    command: python /app/app.py
    environment:
      VERSION: "1.0.0"
      FAIL_MODE: "none"
      PORT: "8080"
      DB_PATH: "/data/soc.db"
    volumes:
      - ./portal:/app:ro
      - ./datos:/data
    ports: ["8091:8080"]
    healthcheck:
      # Sonda REAL: llama a /health, que a su vez comprueba la BD. Si la BD cae, esto falla.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --- versión candidata (canario). FAIL_MODE se inyecta desde el entorno. ---
  canario:
    image: python:3.12-slim
    container_name: portal-canario
    working_dir: /app
    command: python /app/app.py
    environment:
      VERSION: "2.0.0"
      FAIL_MODE: "${CANARY_FAIL:-none}"   # http5xx en el laboratorio -> fuerza la reversión
      PORT: "8080"
      DB_PATH: "/data/soc.db"
    volumes:
      - ./portal:/app:ro
      - ./datos:/data
    ports: ["8092:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 3s
    profiles: ["canario"]
    restart: "no"

  # --- proxy de reparto por peso (90% estable / 10% canario) ---
  #     Solo con el perfil "proxy": necesita que AMBOS servicios existan.
  proxy:
    image: nginx:1.27-alpine
    container_name: portal-proxy
    volumes:
      - ./nginx-canario.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [estable, canario]
    profiles: ["proxy"]
    restart: unless-stopped
