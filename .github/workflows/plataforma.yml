name: Plataforma del curso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generar la web
        run: uv run --python 3.12 --with-requirements plataforma/requirements.txt python3 plataforma/build.py --strict
      - name: Paquete para el aula sin Internet
        run: cd _build/site && zip -qr ../../curso-web-offline.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: curso-web-offline
          path: curso-web-offline.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
