# hsts-web — el MISMO login que el portal, pero BIEN configurado: HTTPS + HSTS.
# Objetivo pedagógico: cuando el navegador ha visto la cabecera HSTS una vez, se niega
# a hablar HTTP con este host. El sslstrip / downgrade del MITM FALLA. Esa es la lección
# defensiva de la unidad: el cifrado bien configurado frustra al intermediario.

server {
    listen 80;
    server_name hsts.xest.local objetivo.xest.local;
    # Todo HTTP se redirige a HTTPS (301). Con HSTS ya fijado, el navegador ni lo intenta.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hsts.xest.local objetivo.xest.local;

    ssl_certificate     /etc/nginx/certs/hsts.crt;
    ssl_certificate_key /etc/nginx/certs/hsts.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # La cabecera clave: fuerza HTTPS durante 1 año en este host (y subdominios).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>hsts.xest.local</title><body style="font-family:system-ui;background:#0b1220;color:#e6edf3"><h1>Portal SOC (endurecido) &mdash; HTTPS + HSTS</h1><p>Si has llegado aqu&iacute; por HTTPS y ves el candado, el MITM en claro no puede leerte ni modificarte.</p></body>';
    }
}
