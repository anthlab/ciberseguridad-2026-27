# hostapd-xest-lab.conf — AP de laboratorio para HE · UT3 (NO USAR FUERA DEL LAB)
#
# Levanta el punto de acceso 'xest-lab' con WPA2-PSK y una clave DÉBIL a propósito,
# para que la práctica de captura + crackeo funcione en clase. Debe emitir SOLO
# dentro de la jaula/VLAN aislada del aula.
#
# Arranque:
#   sudo systemctl stop NetworkManager      # o desasociar la interfaz del AP
#   sudo hostapd /ruta/hostapd-xest-lab.conf
#
# IMPORTANTE (profesor): antes de clase, verifica que la clave está en rockyou para
# que el diccionario funcione:
#   grep -x 'password' /usr/share/wordlists/rockyou.txt
# Si cambias 'wpa_passphrase', vuelve a comprobarlo. La clave debe tener 8-63 chars.

# --- Radio / interfaz ---
interface=wlan1            # interfaz física del AP del centro (AJUSTAR)
driver=nl80211
country_code=ES
ieee80211d=1

# --- Identidad de la red ---
ssid=xest-lab
hw_mode=g                  # 2,4 GHz (mejor compatibilidad con adaptadores del aula)
channel=6                  # canal fijo: facilita 'airodump -c 6'

# --- Seguridad: WPA2-Personal (CCMP) con clave débil de laboratorio ---
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
wpa_passphrase=password    # DÉBIL A PROPÓSITO. Verificar en rockyou (ver arriba).

# --- PMF (Protected Management Frames / 802.11w) ---
# Se deja DESACTIVADO (0) para que el ataque de deauth de la S1 funcione.
# En la S3 se explica que activarlo (ieee80211w=2) neutraliza el deauth: para una
# demo defensiva opcional, cambiar a 2 y comprobar que aireplay ya no fuerza el
# handshake.
ieee80211w=0

# --- Otros ---
auth_algs=1                # solo Open System (WPA2 lo gestiona por encima)
ignore_broadcast_ssid=0    # SSID visible (aparece en airodump)
